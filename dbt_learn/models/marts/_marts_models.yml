version: 2

models:
  - name: fct_orders
    description: "One row per order, with payment totals. Built from stg_orders and stg_payments."
    meta:
      owner: "Pratibha"
    columns:
      - name: order_id
        description: "Unique ID of the order"
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Customer who placed the order"
      - name: order_status
        description: '{{ doc("order_status") }}'
      - name: total_paid_rupees
        description: "Sum of all payments for the order, in rupees. Empty if no amount was recorded."
      - name: has_payment
        description: "True if at least one payment exists for the order"

  - name: dim_customers
    description: "One row per customer, with order history and lifetime value"
    meta:
      owner: "Pratibha"
    columns:
      - name: customer_id
        description: "Unique ID of the customer"
        data_tests:
          - unique
          - not_null
      - name: lifetime_value_rupees
        description: "Total paid across all orders except returned ones, in rupees"