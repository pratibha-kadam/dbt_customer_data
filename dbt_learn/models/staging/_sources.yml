version: 2

sources:
  - name: shop_raw
    description: "Raw shop data (loaded from seeds for practice)"
    database: data-lake-data-domain
    schema: pratibha_sandbox_raw
    tables:
      - name: raw_customers
      - name: raw_orders
        columns:
          - name: order_id
            data_tests:
              - unique
              - not_null
          - name: order_status
            description: '{{ doc("order_status") }}'    
      - name: raw_payments