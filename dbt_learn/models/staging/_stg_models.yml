version: 2

models:
  - name: stg_customers
    description: "Cleaned customers, one row per customer"
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: stg_orders
    description: "Cleaned orders, one row per order"
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['placed', 'shipped', 'completed', 'returned']
      - name: customer_id
        data_tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id

  - name: stg_payments
    description: "Cleaned payments, amounts converted to rupees"
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: amount_paise
        data_tests:
          - not_null
          